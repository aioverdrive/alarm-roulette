<!DOCTYPE HTML>
<html>
    <head>
        <title>Friends</title>
        <link rel="stylesheet" href="/alarm-roulette/alarm-roulette/css/styles.css">
        <meta name=“viewport” content="width=device-width" initial-scale=1.0>
        <meta charset="UTF-8">
        <script src="https://kit.fontawesome.com/a89918f07b.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <h1>Your Friend Groups</h1>
        <div class="friend-group-card center" style="border: dotted red;">
            <div class="friend-group-card-segment" style="border: dotted blue">
                <p>[Friend group name]'s Roulette</p>
                <p>Includes [Name 1], [Name 2], and [X] more.</p>
                <!-- make the X a tooltip to reveal all the names -->
            </div>
            <div class="friend-group-card-segment" style="border: dotted green">
                <span>You've spun this alarm roulette [X] times</span>
                <button><i class="fa-solid fa-person-circle-plus"></i>Add friend</button>
            </div>
        </div>
        <div class="bg-icon-card" style="border: dotted grey">
            <i class="fa-solid fa-plus"></i>
            <p>Start another roulette</p>
        </div>
        <nav class="nav">
            <a href="alarm-homepage.html" class="nav-link">
                <i class="fa-solid fa-alarm-clock"></i>
                <span class="nav-text">Alarm</span>
            </a>
            <a href="friends.html" class="nav-link">
                <i class="fa-solid fa-user-group"></i>
                <span class="nav-text">Friends</span>
            </a>
            <a href="upload-sound.html" class="nav-link">
                <i class="fa-solid fa-microphone"></i>
                <span class="nav-text">Upload Sound</span>
            </a>
            <a href="settings.html" class="nav-link">
                <i class="fa-solid fa-gear"></i>
                <span class="nav-text">Settings</span>
            </a>
        </nav>
    </body>
</html>
